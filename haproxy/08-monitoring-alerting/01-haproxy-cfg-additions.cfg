# --- Add/merge into your existing /etc/haproxy/haproxy.cfg ---

global
    log 127.0.0.1:514 local0
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    log global
    # This exact format string matters — grok_exporter (Part C) parses fields
    # by position, and Tq/Tw/Tc/Tr/Tt (queue/wait/connect/response/total time,
    # all ms) are what per-request response-time visualization is built on.
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Prometheus native exporter — frontend/backend/server metrics.
# Separate port, bound to monitoring-only reachability if you can firewall it.
frontend prometheus
    bind *:8404
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    no log

# Your existing frontends stay as-is, just make sure each has:
#   log global
#   option httplog
# already inherited from defaults above — don't override with `no log` on
# your real traffic frontends or you lose the access-log data Part C needs.
